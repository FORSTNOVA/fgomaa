# 3T 战斗队伍与技能时序预设配置 (全面覆盖蓝卡、红卡、绿卡、多核的换人与不换人 3T 体系)

teams:
  # ==================== 1. 蓝卡换人与冲浪体系 (Arts Meta) ====================
  # 预设 1A: 蓝卡双C呆 + 奥伯龙换人 3T 队 (最高伤害与极高稳定性，90+/90++核弹秒杀关底)
  - id: "arts_castoria_oberon_swap"
    name: "蓝卡双C呆+奥伯龙换人3T队"
    match_servants:
      - "阿尔托莉雅·Caster"
      - "奥伯龙"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 2, skill: 1 }                          # C呆1群充 30% + 加攻 20%
          - { servant: 2, skill: 3, target: 1 }               # C呆1蓝魔放 50% -> 给打手
          - { servant: 3, skill: 1 }                          # 助战C呆群充 30% + 加攻 20%
          - { servant: 3, skill: 3, target: 1 }               # 助战C呆蓝魔放 50% -> 给打手
          - { servant: 1, skill: 1 }                          # 打手自开增益
        np_servant: 1
      2:
        skills:
          - { servant: 2, skill: 2, target: 1 }               # C呆1单充 20% -> 给打手补足第一波宝具回收
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }                        # 决战服/战斗服换人: 2号位交完技能的C呆 换 4号位奥伯龙
          - { skill: 1 }                                      # 决战服加攻与宝威提升
        skills:
          - { servant: 3, skill: 2, target: 1 }               # 助战C呆单充 20% -> 给打手
          - { servant: 4, skill: 1 }                          # 奥伯龙 1 技群充 20% + 宝具威力提升 30%
          - { servant: 4, skill: 2, target: 1 }               # 奥伯龙 2 技单充 50% -> 给打手
          - { servant: 4, skill: 3, target: 1 }               # 奥伯龙 3 技宝威翻倍 + 红魔放 50% -> 给打手
          - { servant: 1, skill: 1 }                          # 打手自充/自增伤 (若转好)
        np_servant: 1

  # 预设 1B: 蓝卡双C呆 + 孔明换人 3T 队 (备选 50% 纯充能换人)
  - id: "arts_castoria_waver_swap"
    name: "蓝卡双C呆+孔明换人3T队"
    match_servants:
      - "阿尔托莉雅·Caster"
      - "诸葛孔明"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 2, skill: 1 }
          - { servant: 2, skill: 3, target: 1 }
          - { servant: 3, skill: 1 }
          - { servant: 3, skill: 3, target: 1 }
          - { servant: 1, skill: 1 }
        np_servant: 1
      2:
        skills:
          - { servant: 2, skill: 2, target: 1 }
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }
          - { skill: 1 }
        skills:
          - { servant: 3, skill: 2, target: 1 }
          - { servant: 4, skill: 1, target: 1 }               # 孔明 1 技单充 30%
          - { servant: 4, skill: 2 }                          # 孔明 2 技群充 10% + 加防
          - { servant: 4, skill: 3 }                          # 孔明 3 技群充 10% + 加攻
        np_servant: 1

  # 预设 1C: C呆蓝卡不换人冲浪队 (纯双C呆 3T 经典不换人)
  - id: "arts_castoria_system"
    name: "C呆蓝卡连发队"
    match_servants:
      - "阿尔托莉雅·Caster"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 2, skill: 1 }                          # C呆 1 技群充 30%
          - { servant: 2, skill: 3, target: 1 }               # C呆 3 技蓝魔放给打手
          - { servant: 3, skill: 1 }                          # 助战 C呆 1 技群充 30%
          - { servant: 3, skill: 3, target: 1 }               # 助战 C呆 3 技蓝魔放给打手
          - { servant: 1, skill: 1 }                          # 打手自开技能
        np_servant: 1
      2:
        skills:
          - { servant: 2, skill: 2, target: 1 }               # C呆 2 技单充 20%
        np_servant: 1
      3:
        skills:
          - { servant: 3, skill: 2, target: 1 }               # 助战 C呆 2 技单充 20%
        master_skills:
          - { skill: 1 }                                      # 御主加攻 / 宝威增伤
        np_servant: 1

  # ==================== 2. 红卡双杀狐换人体系 (Buster Meta) ====================
  # 预设 2A: 摩根 + 双杀狐 + 奥伯龙换人 3T 队 (顶级泛用红卡 3T 核心)
  - id: "buster_morgan_koyan"
    name: "摩根红卡双杀狐+奥伯龙换人3T队"
    match_servants:
      - "摩根"
      - "光之高扬斯卡娅"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 1, skill: 1 }                          # 摩根 1 技 (自充30%+加攻)
          - { servant: 2, skill: 3, target: 1 }               # 杀狐 3 技 (红魔放+减CD) -> 给摩根
          - { servant: 3, skill: 3, target: 1 }               # 助战杀狐 3 技 -> 给摩根
          - { servant: 2, skill: 1, target: 1 }               # 杀狐 1 技 (50%充能) -> 给摩根
        np_servant: 1
      2:
        skills:
          - { servant: 3, skill: 1, target: 1 }               # 助战杀狐 1 技 (50%充能-2CD) -> 摩根累计-4CD
          - { servant: 1, skill: 2, target: 1 }               # 摩根 2 技 (单体20%充能) -> 给自己
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }                        # 换人服: 2号位杀狐 换 4号位奥伯龙
          - { skill: 1 }                                      # 决战服加攻增伤
        skills:
          - { servant: 4, skill: 1 }                          # 奥伯龙 1 技 (全体20%充能+宝威)
          - { servant: 4, skill: 2, target: 1 }               # 奥伯龙 2 技 (单体50%充能) -> 给摩根
          - { servant: 4, skill: 3, target: 1 }               # 奥伯龙 3 技 (宝威翻倍+红魔放) -> 给摩根
          - { servant: 1, skill: 1 }                          # 摩根 CD 转好的 1 技再次开启 (自充30%+加攻)
        np_servant: 1

  # 预设 2B: 阿周那(Alter) 狂娜 + 双杀狐 + 奥伯龙换人 3T 队
  - id: "buster_arjuna_alter"
    name: "狂娜红卡双杀狐+奥伯龙换人3T队"
    match_servants:
      - "阿周那(Alter)"
      - "光之高扬斯卡娅"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 1, skill: 1 }                          # 狂娜 1 技 (特攻加攻)
          - { servant: 1, skill: 2 }                          # 狂娜 2 技 (自充30%)
          - { servant: 2, skill: 3, target: 1 }               # 杀狐红魔放给狂娜
          - { servant: 3, skill: 3, target: 1 }
          - { servant: 2, skill: 1, target: 1 }               # 杀狐50充给狂娜
        np_servant: 1
      2:
        skills:
          - { servant: 3, skill: 1, target: 1 }               # 助战杀狐50充-2CD
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }                        # 换人服换奥伯龙
          - { skill: 1 }
        skills:
          - { servant: 4, skill: 1 }
          - { servant: 4, skill: 2, target: 1 }
          - { servant: 4, skill: 3, target: 1 }
          - { servant: 1, skill: 2 }                          # 狂娜 2 技转好再自充30
        np_servant: 1

  # 预设 2C: 红卡双杀狐 + 孔明换人 3T 队
  - id: "buster_koyan_waver_swap"
    name: "红卡双杀狐+孔明换人3T队"
    match_servants:
      - "光之高扬斯卡娅"
      - "诸葛孔明"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 1, skill: 1 }
          - { servant: 2, skill: 3, target: 1 }
          - { servant: 3, skill: 3, target: 1 }
          - { servant: 2, skill: 1, target: 1 }
        np_servant: 1
      2:
        skills:
          - { servant: 3, skill: 1, target: 1 }
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }
          - { skill: 1 }
        skills:
          - { servant: 4, skill: 1, target: 1 }               # 孔明30单充
          - { servant: 4, skill: 2 }                          # 孔明10群充
          - { servant: 4, skill: 3 }                          # 孔明10群充+加攻
          - { servant: 1, skill: 1 }                          # 打手CD转好的自充再次开启
        np_servant: 1

  # ==================== 3. 绿卡斯卡蒂换人体系 (Quick Meta) ====================
  # 预设 3A: 绿卡双斯卡蒂 + 奥伯龙换人 3T 队
  - id: "quick_skadi_oberon_swap"
    name: "绿卡双斯卡蒂+奥伯龙换人3T队"
    match_servants:
      - "斯卡蒂"
      - "奥伯龙"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 2, skill: 1, target: 1 }               # 斯卡蒂1 绿魔放 50%
          - { servant: 2, skill: 3, target: 1 }               # 斯卡蒂1 单充 50%
          - { servant: 3, skill: 1, target: 1 }               # 助战斯卡蒂 绿魔放 50%
          - { servant: 1, skill: 1 }                          # 打手自开技能
        np_servant: 1
      2:
        skills:
          - { servant: 3, skill: 3, target: 1 }               # 助战斯卡蒂 单充 50%
          - { servant: 2, skill: 2 }                          # 斯卡蒂1 降防
          - { servant: 3, skill: 2 }                          # 助战斯卡蒂 降防
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }                        # 换人服: 2号位斯卡蒂 换 4号位奥伯龙
          - { skill: 1 }
        skills:
          - { servant: 4, skill: 1 }                          # 奥伯龙 1 技群充 20% + 宝威
          - { servant: 4, skill: 2, target: 1 }               # 奥伯龙 2 技单充 50%
          - { servant: 4, skill: 3, target: 1 }               # 奥伯龙 3 技宝威翻倍 + 红魔放 50%
        np_servant: 1

  # 预设 3B: 绿卡三斯卡蒂换人 3T 队 (水CBA + 助战水CBA + 术CBA 换人，150% 绿魔放极限叠加)
  - id: "quick_triple_skadi_swap"
    name: "绿卡三斯卡蒂换人3T队"
    match_servants:
      - "斯卡蒂"
      - "斯卡哈"
    required_min_np_charge: 20
    turns:
      1:
        skills:
          - { servant: 2, skill: 1, target: 1 }               # 水CBA 1 绿魔放 50%
          - { servant: 2, skill: 3, target: 1 }               # 水CBA 1 单充 50%
          - { servant: 3, skill: 1, target: 1 }               # 助战水CBA 绿魔放 50%
          - { servant: 1, skill: 1 }                          # 打手自开技能
        np_servant: 1
      2:
        skills:
          - { servant: 3, skill: 3, target: 1 }               # 助战水CBA 单充 50%
          - { servant: 2, skill: 2 }                          # 水CBA 降防加攻
          - { servant: 3, skill: 2 }                          # 助战水CBA 降防加攻
        np_servant: 1
      3:
        master_skills:
          - { skill: 3, swap: [2, 4] }                        # 换人服: 2号位水CBA 换 4号位术CBA
          - { skill: 1 }
        skills:
          - { servant: 4, skill: 1, target: 1 }               # 术CBA 绿魔放 50% (全队累计 150% 绿魔放!)
          - { servant: 4, skill: 2 }                          # 术CBA 降防 30%
          - { servant: 4, skill: 3, target: 1 }               # 术CBA 单充 50%
        np_servant: 1

  # ==================== 4. 多核自爆退场接力体系 (Multi-Core Meta) ====================
  # 预设 4A: 阿拉什大英雄自爆接力换人流 3T (经典 B站/NGA 低配亲民 3T 战术)
  - id: "multicore_arash_sacrifice"
    name: "阿拉什大英雄自爆接力换人流3T"
    match_servants:
      - "阿拉什"
    turns:
      1:
        skills:
          - { servant: 1, skill: 3 }                          # 阿拉什 3 技自充 30% (配合 50%NP 礼装或被动满充)
        np_servant: 1                                         # 阿拉什自爆清波次 1，退场后 4号位辅助拐自动补位到前排！
      2:
        skills:
          - { servant: 3, skill: 1 }                          # 助战辅助群充
          - { servant: 3, skill: 3, target: 2 }               # 助战辅助给 2号位主核打手魔放增伤
          - { servant: 2, skill: 1 }                          # 2号位主核打手自充/自增伤
        np_servant: 2                                         # 2号位主核宝具清波次 2！
      3:
        master_skills:
          - { skill: 1 }                                      # 决战服加攻增伤
        skills:
          - { servant: 1, skill: 1 }                          # 补位到1号位的新辅助充能/加攻
          - { servant: 1, skill: 2, target: 2 }               # 补位辅助给 2号位主核单充
          - { servant: 3, skill: 2, target: 2 }               # 助战辅助单充
        np_servant: 2                                         # 2号位主核宝具清关底！
